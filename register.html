{% extends "base.html" %}

{% block title %}Create Account – FoodEase{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card register-auth-card">
        <div class="auth-header">
            <div class="auth-brand-icon">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <h1 class="auth-title">Create Your Account</h1>
            <p class="auth-subtitle">Join FoodEase for rapid gourmet delivery and culinary deals</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="auth-form" novalidate>

            <!-- Full Name -->
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input
                        type="text" id="name" name="name"
                        class="form-input"
                        placeholder="e.g. Aarav Sharma"
                        value="{{ form_name }}"
                        required
                    />
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input
                        type="email" id="email" name="email"
                        class="form-input"
                        placeholder="you@example.com"
                        value="{{ form_email }}"
                        required
                    />
                </div>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone" class="form-label">Mobile Number</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input
                        type="tel" id="phone" name="phone"
                        class="form-input"
                        placeholder="+91 98765 43210"
                        value="{{ form_phone }}"
                    />
                </div>
            </div>

            <!-- Password & Confirm Password (Grid) -->
            <div class="form-row-two-col">
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input
                            type="password" id="password" name="password"
                            class="form-input"
                            placeholder="Min. 6 characters"
                            required
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-shield-check input-icon"></i>
                        <input
                            type="password" id="confirm_password" name="confirm_password"
                            class="form-input"
                            placeholder="Repeat password"
                            required
                        />
                    </div>
                </div>
            </div>

            <!-- Role Selection -->
            <div class="form-group">
                <label class="form-label">I am joining as a…</label>
                <div class="role-options-grid">
                    <label class="role-card-option {% if form_role == 'customer' %}selected-role{% endif %}">
                        <input type="radio" name="role" value="customer" {% if form_role == 'customer' %}checked{% endif %} />
                        <div class="role-icon-box"><i class="fa-solid fa-bag-shopping"></i></div>
                        <div class="role-text-box">
                            <strong>Hungry Foodie</strong>
                            <span>Discover and order delicious food</span>
                        </div>
                        <i class="fa-solid fa-circle-check role-check"></i>
                    </label>

                    <label class="role-card-option {% if form_role == 'restaurant_owner' %}selected-role{% endif %}">
                        <input type="radio" name="role" value="restaurant_owner" {% if form_role == 'restaurant_owner' %}checked{% endif %} />
                        <div class="role-icon-box"><i class="fa-solid fa-store"></i></div>
                        <div class="role-text-box">
                            <strong>Restaurant Partner</strong>
                            <span>List your restaurant and grow orders</span>
                        </div>
                        <i class="fa-solid fa-circle-check role-check"></i>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-auth-submit">
                <span>Create FoodEase Account</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer-text">
            <span>Already have an account?</span>
            <a href="{{ url_for('login') }}" class="auth-link">Sign in here</a>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
    // Radio selection toggle for role cards
    document.querySelectorAll('.role-card-option input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.querySelectorAll('.role-card-option').forEach(el => el.classList.remove('selected-role'));
            if (this.checked) {
                this.closest('.role-card-option').classList.add('selected-role');
            }
        });
    });
</script>
{% endblock %}
